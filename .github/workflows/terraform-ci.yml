name: Terraform CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tf-plugin-cache
  TERRAFORM_VERSION: "1.17.1"
  TFLINT_VERSION: "0.65.0"
  CHECKOV_VERSION: "3.4.3"

jobs:
  terraform-checks:
    name: terraform-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v${{ env.TFLINT_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: pip install "checkov==$CHECKOV_VERSION"

      - name: 1. terraform fmt -check
        run: terraform fmt -check -recursive -diff

      - name: 2. terraform init -backend=false
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          status=0
          for dir in $(find . -name '*.tf' -not -path '*/.terraform/*' -printf '%h\n' | sort -u); do
            echo "::group::init $dir"
            terraform -chdir="$dir" init -backend=false -input=false || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: 3. terraform validate
        run: |
          status=0
          for dir in $(find . -name '*.tf' -not -path '*/.terraform/*' -printf '%h\n' | sort -u); do
            echo "::group::validate $dir"
            terraform -chdir="$dir" validate || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: 4. tflint
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

      - name: 5. checkov
        run: checkov --config-file .checkov.yaml

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
